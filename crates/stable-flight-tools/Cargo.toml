[package]
name = "stable-flight-tools"
description = "Developer tools for Stable Flight: flight-path plotting, waypoint-script generation, a native-link pilot, and a RealFlight frame checker"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
stable-flight = { path = "../stable-flight" }
stable-flight-sitl = { path = "../stable-flight-sitl" }
stable-flight-link = { path = "../stable-flight-link", features = ["std"] }
stable-flight-sitl-realflight = { path = "../stable-flight-sitl-realflight" }
clap.workspace = true
plotters = { version = "0.3", default-features = false, features = [
    "bitmap_backend",   # BitMapBackend (in-memory raster)
    "bitmap_encoder",   # save rasters to .png
    "svg_backend",      # SVGBackend
    "line_series",      # LineSeries
    "ttf",              # text layout via system fonts (resolves "sans-serif")
] }

[dev-dependencies]
assert2.workspace = true
