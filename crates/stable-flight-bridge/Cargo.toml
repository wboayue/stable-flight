[package]
name = "stable-flight-bridge"
description = "Companion-computer bridge between a Stable Flight flight controller's native link and MAVLink ground stations"
readme = "README.md"
keywords = ["mavlink", "flight-controller", "drone", "companion-computer", "qgroundcontrol"]
categories = ["aerospace::drones", "command-line-utilities"]
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
stable-flight-link = { path = "../stable-flight-link", version = "0.1.0", features = ["std"] }
stable-flight-mavlink = { path = "../stable-flight-mavlink", version = "0.1.0" }
mavlink.workspace = true
clap.workspace = true
log.workspace = true
env_logger = "0.11.6"

[dev-dependencies]
# The flight-controller side of the link, for end-to-end tests.
stable-flight-link = { path = "../stable-flight-link", features = ["std", "testing"] }
stable-flight = { path = "../stable-flight", features = ["testing"] }
assert2.workspace = true
