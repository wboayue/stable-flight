[package]
name = "stable-flight"
description = "Flight-control core for Stable Flight: pipeline traits, copter guidance, cascaded-PID stabilizers, mixers, and the per-tick flight loop"
readme = "README.md"
keywords = ["flight-controller", "drone", "robotics", "control-systems", "pid"]
categories = ["aerospace::drones", "science::robotics"]
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# f32 math that `core` lacks (`powf`).
libm.workspace = true
nalgebra.workspace = true
log.workspace = true
serde = { workspace = true, optional = true }

[features]
# Test doubles and the backend conformance kit in `stable_flight::testing`. For
# dev-dependencies only; never needed at runtime.
testing = []
# `Serialize`/`Deserialize` on the pipeline data types (`Command`, `VehicleState`, ...), for
# wire protocols such as `stable-flight-link`. Stays no_std.
serde = ["dep:serde", "nalgebra/serde-serialize-no-std"]
# `params::metadata`: descriptions, units, groups, and ranges for each param table, for ground
# stations (the bridge's QGC metadata). Host-side; firmware leaves it off, so it costs no flash.
param-metadata = []

[dev-dependencies]
approx.workspace = true
assert2.workspace = true

# Render the `testing` doubles and conformance kit on docs.rs; backend authors use them.
[package.metadata.docs.rs]
all-features = true
