[package]
name = "stable-flight-sim"
description = "Deterministic rigid-body multirotor, airplane, tailsitter, and quadplane simulator for Stable Flight's closed-loop tests"
readme = "README.md"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
stable-flight = { path = "../stable-flight" }
libm.workspace = true
thiserror.workspace = true

[dev-dependencies]
approx.workspace = true
assert2.workspace = true
stable-flight = { path = "../stable-flight", features = ["testing"] }
# The failsafe test flies from the link, as a companion would.
stable-flight-link = { path = "../stable-flight-link", features = ["testing"] }
