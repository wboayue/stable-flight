# Coverage settings shared by `just cover` and the `coverage` workflow; each adds only its output
# format. Excluded: board firmware (its own workspace) and examples, which need a simulator or a
# joystick, so tests never run them.
[coverage]
workspace = true
all-features = true
exclude-files = ["firmware/*", "crates/*/examples/*"]
# A sim test binary goes over a minute without output under instrumentation on CI, past the
# 60 s default.
timeout = "600s"
# LLVM source-based coverage, as on macOS: Linux defaults to ptrace, which stops the test at
# each instrumented line and runs the sim's closed-loop tests several times slower.
engine = "Llvm"
