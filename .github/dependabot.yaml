version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    # Batch minor and patch bumps (incl. Cargo.lock-only updates) into one PR; majors stay separate.
    groups:
      cargo:
        update-types: ["minor", "patch"]
  - package-ecosystem: "cargo"
    directory: "/firmware/ark-fpv"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    groups:
      firmware:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    groups:
      actions:
        update-types: ["minor", "patch"]
