name: test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable

    - name: prerequisites
      run: |
        sudo apt update
        sudo apt install -y libudev-dev

    - name: build (default features)
      # The test step enables every feature (including core `testing`); this catches library
      # code that accidentally depends on a dev-only feature.
      run: |
        cargo build --workspace

    - name: test
      run: |
        cargo test --workspace --all-features
