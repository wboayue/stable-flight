name: test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable

    - name: prerequisites
      run: |
        sudo apt update
        sudo apt install -y libudev-dev

    - name: build (default features)
      # The test step enables every feature (including core `testing`); this catches library
      # code that accidentally depends on a dev-only feature.
      run: |
        cargo build --workspace

    - name: backends never depend on sitl
      # A simulator backend may use the sitl harness only as a dev-dependency (examples), so it
      # stays usable with any runner. Outputs are captured before grepping so a failing cargo
      # or jq fails the step instead of passing it.
      run: |
        set -euo pipefail
        crates=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name | select(startswith("stable-flight-sitl-"))')
        if [ -z "$crates" ]; then
          echo "::error::no stable-flight-sitl-* backend crates found"
          exit 1
        fi
        for crate in $crates; do
          tree=$(cargo tree -p "$crate" -e normal --target all --prefix none)
          if grep -q '^stable-flight-sitl v' <<< "$tree"; then
            echo "::error::$crate has stable-flight-sitl as a normal dependency (dev-dependency only)"
            exit 1
          fi
        done

    - name: test
      run: |
        cargo test --workspace --all-features

  embedded:
    # Keeps the core no_std: a bare-metal target has no `std` to fall back on.
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: thumbv7em-none-eabihf
        components: llvm-tools, rustfmt, clippy

    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-binutils

    - name: build core (thumbv7em-none-eabihf)
      run: |
        cargo build -p stable-flight --target thumbv7em-none-eabihf
        cargo build -p stable-flight --features testing --target thumbv7em-none-eabihf

    # The firmware is a nested workspace; run from its dir so its .cargo/config.toml (target,
    # linker script) applies. A core change that breaks the link or grows flash shows here.
    - name: firmware (ARK FPV)
      working-directory: firmware/ark-fpv
      run: |
        cargo fmt --check
        cargo clippy --release -- -D warnings
        cargo build --release
        cargo size --release
