name: test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# A new push to a PR cancels its in-flight run. Main gets a group per commit, so every merge is
# tested and seeds the cache (a shared group would drop queued runs).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Line tables keep backtrace line numbers while cutting compile/link time and cache size.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2

    - name: prerequisites
      # Skip `apt update` unless the runner image's package index is stale.
      run: |
        sudo apt-get install -y --no-install-recommends libudev-dev \
          || { sudo apt-get update && sudo apt-get install -y --no-install-recommends libudev-dev; }

    - name: test
      run: |
        cargo test --workspace --all-features --locked

  lint:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - uses: Swatinem/rust-cache@v2

    - name: prerequisites
      # Skip `apt update` unless the runner image's package index is stale.
      run: |
        sudo apt-get install -y --no-install-recommends libudev-dev \
          || { sudo apt-get update && sudo apt-get install -y --no-install-recommends libudev-dev; }

    - name: backends never depend on sitl
      # A simulator backend may use the sitl harness only as a dev-dependency (examples), so it
      # stays usable with any runner. Outputs are captured before grepping so a failing cargo
      # or jq fails the step instead of passing it.
      run: |
        set -euo pipefail
        crates=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[].name | select(startswith("stable-flight-sitl-"))')
        if [ -z "$crates" ]; then
          echo "::error::no stable-flight-sitl-* backend crates found"
          exit 1
        fi
        for crate in $crates; do
          tree=$(cargo tree --locked -p "$crate" -e normal --target all --prefix none)
          if grep -q '^stable-flight-sitl v' <<< "$tree"; then
            echo "::error::$crate has stable-flight-sitl as a normal dependency (dev-dependency only)"
            exit 1
          fi
        done

    - name: lint (warnings are errors)
      # Default-feature rustdoc also type-checks every lib and bin without dev-only features (the
      # test job enables all of them, including core `testing`), and catches intra-doc links to
      # feature-gated items (docs.rs builds all features, so they'd only break locally).
      env:
        RUSTDOCFLAGS: -D warnings
      run: |
        cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
        cargo doc --workspace --no-deps --locked

  msrv:
    # Checks the workspace on the toolchain named by `rust-version` in the root Cargo.toml, so a
    # change that needs a newer compiler fails here until it raises `rust-version`.
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v7
    - name: read rust-version
      id: msrv
      run: |
        set -euo pipefail
        version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
        if [ -z "$version" ]; then
          echo "::error::no rust-version in the root Cargo.toml"
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.msrv.outputs.version }}
    - uses: Swatinem/rust-cache@v2

    - name: prerequisites
      # Skip `apt update` unless the runner image's package index is stale.
      run: |
        sudo apt-get install -y --no-install-recommends libudev-dev \
          || { sudo apt-get update && sudo apt-get install -y --no-install-recommends libudev-dev; }

    - name: check
      run: |
        cargo check --workspace --all-features --all-targets --locked

  embedded:
    # Keeps the core, link, and sim no_std (a bare-metal target has no `std` to fall back on), and lints,
    # links, and sizes the board firmware.
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: thumbv7em-none-eabihf
        components: llvm-tools, rustfmt, clippy
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          . -> target
          firmware/ark-fpv -> target

    - name: build core, link, and sim (thumbv7em-none-eabihf)
      run: |
        cargo build -p stable-flight --locked --target thumbv7em-none-eabihf
        cargo build -p stable-flight --features testing --locked --target thumbv7em-none-eabihf
        cargo build -p stable-flight --features serde --locked --target thumbv7em-none-eabihf
        cargo build -p stable-flight --features param-metadata --locked --target thumbv7em-none-eabihf
        cargo build -p stable-flight-link --locked --target thumbv7em-none-eabihf
        cargo build -p stable-flight-link --features testing --locked --target thumbv7em-none-eabihf
        cargo build -p stable-flight-sim --locked --target thumbv7em-none-eabihf

    # The firmware is a nested workspace; run from its dir so its .cargo/config.toml (target,
    # linker script) applies. A core change that breaks the link fails here, and so does flash use
    # (text + data) over FLASH_BUDGET_BYTES.
    - name: firmware (ARK FPV)
      working-directory: firmware/ark-fpv
      env:
        # The STM32H743 has 2 MB of flash and the linker fails past it; this budget catches
        # unexpected growth (formatting, dynamic math, a stray dependency) long before that.
        # 64 KiB is about 2x the 30,192 B release build; a PR that grows the firmware on purpose
        # raises it with the measured size (`just fw-size`).
        FLASH_BUDGET_BYTES: 65536
      run: |
        set -euo pipefail
        cargo fmt --check
        cargo clippy --locked --release -- -D warnings
        cargo clippy --locked --release --features bench-armed -- -D warnings
        cargo build --locked --release
        # llvm-size from the llvm-tools component, so no cargo-binutils install is needed.
        sizes=$("$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin/llvm-size" \
          target/thumbv7em-none-eabihf/release/ark-fpv)
        echo "$sizes"
        flash=$(awk 'NR == 2 { print $1 + $2 }' <<< "$sizes")
        if [ -z "$flash" ]; then
          echo "::error::could not read flash use from llvm-size"
          exit 1
        fi
        echo "flash: $flash of $FLASH_BUDGET_BYTES B budget"
        if [ "$flash" -gt "$FLASH_BUDGET_BYTES" ]; then
          echo "::error::firmware flash use $flash B exceeds the $FLASH_BUDGET_BYTES B budget"
          exit 1
        fi
