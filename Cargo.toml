[workspace]
resolver = "3"
members = ["crates/*"]
# Board firmware lives in nested workspaces (own target, profiles, and lockfile).
exclude = ["firmware"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Wil Boayue <wil@wsblabs.com>"]
license = "MIT"
repository = "https://github.com/wboayue/stable-flight"

[workspace.dependencies]
# no_std defaults for the core. Host crates add `features = ["std"]` to `uom`; robomath's
# `std` feature is empty, so they leave it off.
robomath = { version = "0.1.0", default-features = false }
# Must match the version realflight-bridge uses (its `uom` feature).
uom = { version = "0.38.0", default-features = false, features = ["f32", "si"] }
libm = "0.2"
log = "0.4.25"
thiserror = "2.0"
clap = { version = "4", features = ["derive"] }
approx = "0.5.1"
assert2 = "0.4.0"
