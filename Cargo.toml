[package]
name = "stable-flight-sitl"
version = "0.1.0"
edition = "2021"
keywords = ["realflight", "flight-simulator", "robotics", "control-systems"]
categories = ["aerospace::simulation", "aerospace::drones"]

[dependencies]
realflight-bridge = "0.4.1"
gilrs = "0.11.0"
env_logger = "0.11.6"
log = "0.4.25"
signal-hook = "0.4.1"
rand = "0.9"
mavlink = "0.16.1"
uom = "0.37.0"
byteorder = "1.5.0"
robomath = "0.1.0"
thiserror = "2.0"


[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }  # For Windows-specific APIs

[dev-dependencies]
approx = "0.5.1"
assert2 = "0.3.15"
