[workspace]
resolver = "3"
members = ["crates/*"]
# Board firmware lives in nested workspaces (own target, profiles, and lockfile).
exclude = ["firmware"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Wil Boayue <wil@wsblabs.com>"]
license = "MIT"
repository = "https://github.com/wboayue/stable-flight"

[workspace.dependencies]
# nalgebra stays no_std (`libm` for float math) everywhere; host crates don't need its `std` feature.
nalgebra = { version = "0.35", default-features = false, features = ["libm"] }
libm = "0.2"
# no_std serde (derive only); core's `serde` feature and the link crate.
serde = { version = "1", default-features = false, features = ["derive"] }
log = "0.4.25"
thiserror = "2.0"
clap = { version = "4", features = ["derive"] }
# MAVLink (sitl telemetry, the bridge). `emit-extensions` keeps v2 extension fields such as
# `mission_type`, which QGC sets.
mavlink = { version = "0.17.1", features = ["emit-extensions"] }
crc = "3.4"
approx = "0.5.1"
assert2 = "0.4.0"
