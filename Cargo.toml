[workspace]
resolver = "3"
members = ["crates/*"]
# Board firmware lives in nested workspaces (own target, profiles, and lockfile).
exclude = ["firmware"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Wil Boayue <wil@wsbsolutions.com>"]
license = "MIT"
repository = "https://github.com/wboayue/stable-flight"

[workspace.dependencies]
robomath = "0.1.0"
# Must match the version realflight-bridge uses (its `uom` feature).
uom = "0.38.0"
log = "0.4.25"
thiserror = "2.0"
clap = { version = "4", features = ["derive"] }
approx = "0.5.1"
assert2 = "0.4.0"
